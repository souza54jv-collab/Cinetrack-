<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [shows, setShows] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [status, setStatus] = useState('Visto');

            useEffect(() => {
                const saved = localStorage.getItem('cinetrack_shows');
                if (saved) setShows(JSON.parse(saved));
            }, []);

            const addShow = (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;
                const newShow = { id: Date.now(), name: inputValue, status };
                const updatedShows = [...shows, newShow];
                setShows(updatedShows);
                localStorage.setItem('cinetrack_shows', JSON.stringify(updatedShows));
                setInputValue('');
            };

            const removeShow = (id) => {
                const updatedShows = shows.filter(show => show.id !== id);
                setShows(updatedShows);
                localStorage.setItem('cinetrack_shows', JSON.stringify(updatedShows));
            };

            const renderList = (listStatus) => (
                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
                    <h2 className="text-xl font-bold text-yellow-400 mb-4 border-b border-slate-700 pb-2">{listStatus}</h2>
                    <ul>
                        {shows.filter(s => s.status === listStatus).map(show => (
                            <li key={show.id} className="flex justify-between items-center py-2 border-b border-slate-700/50 last:border-0">
                                <span className="font-medium">{show.name}</span>
                                <button onClick={() => removeShow(show.id)} className="text-red-400 text-sm hover:text-red-300">Remover</button>
                            </li>
                        ))}
                        {shows.filter(s => s.status === listStatus).length === 0 && (
                            <li className="text-slate-500 text-sm italic">Nenhuma série adicionada.</li>
                        )}
                    </ul>
                </div>
            );

            return (
                <div className="max-w-md mx-auto p-6">
                    <h1 className="text-3xl font-extrabold text-center mb-8 tracking-tight">
                        <span className="text-yellow-400">Cine</span>Track
                    </h1>
                    
                    <form onSubmit={addShow} className="mb-8 flex flex-col gap-3">
                        <input 
                            type="text" 
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}
                            placeholder="Nome da série ou filme..." 
                            className="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-yellow-400"
                        />
                        <div className="flex gap-2">
                            <select 
                                value={status} 
                                onChange={(e) => setStatus(e.target.value)}
                                className="bg-slate-800 text-white border border-slate-600 rounded-lg p-3 w-1/2 focus:outline-none focus:border-yellow-400"
                            >
                                <option>Visto</option>
                                <option>A Ver</option>
                                <option>Quero Ver</option>
                            </select>
                            <button type="submit" className="bg-yellow-400 text-slate-900 font-bold rounded-lg p-3 w-1/2 hover:bg-yellow-300 transition-colors">
                                Adicionar
                            </button>
                        </div>
                    </form>

                    {renderList('Visto')}
                    {renderList('A Ver')}
                    {renderList('Quero Ver')}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
